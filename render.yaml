services:
  # =========================================================================
  # 1. FASTAPI ASGI APPLICATION BACKEND (Order XV-A CPC)
  # =========================================================================
  - type: web
    name: cmh-eportal-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///./cmh_portal.db
      - key: PYTHONPATH
        value: .

  # =========================================================================
  # 2. REACT 19 + VITE FRONTEND (Static Web Application)
  # =========================================================================
  - type: web
    name: cmh-eportal-frontend
    runtime: static
    region: oregon
    plan: free
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: cmh-eportal-backend
          property: host
